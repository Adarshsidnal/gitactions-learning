name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-assets-node-${{ matrix.node-version }}
          path: dist/
  
  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Build image
        run: docker build --tag actions-lab:${{ github.sha }} .
        
      - name: Smoke test container
        run: |
          docker run --detach --publish 3000:3000 --name actions-lab actions-lab:${{ github.sha }}
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health